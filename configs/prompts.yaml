# Prompt Configuration
# ====================
#
# 将所有模型的 prompt 提取到此配置文件，方便统一管理和修改。
# 支持变量插值：使用 {variable} 格式，如 {question}
#

prompts:
  # ==================
  # 普通 Prompt（无 CoT）
  # ==================

  standard:
    # VQA 任务
    vqa: |
      Look at the image and answer the following question.
      Question: {question}

      STRICT REQUIREMENTS:
      1. Answer in ONE WORD or NUMBER only
      2. Use lowercase only
      3. No punctuation, no explanation
      4. Examples: "yes", "no", "2", "red", "bicycle"

      Answer:

    # Captioning 任务
    captioning: |
      Describe this image in detail, including all objects, their attributes, and the overall scene.

    # Detection 任务
    detection: |
      Detect all objects in this image.

      CRITICAL REQUIREMENTS:
      1. Return ONLY valid JSON - no explanations, no extra text
      2. Use EXACTLY this structure with ALL brackets closed:
         {"objects": [{"category": "name", "bbox": [x1, y1, x2, y2], "confidence": 0.9}]}
      3. bbox MUST have 4 NUMBERS: [x1, y1, x2, y2] with closing bracket ]
      4. confidence MUST be a number between 0.5-1.0
      5. Complete the JSON before stopping - close all [ and {

      STRICT JSON FORMAT:
      {"objects": [
        {"category": "person", "bbox": [100, 50, 200, 300], "confidence": 0.95},
        {"category": "car", "bbox": [250, 150, 400, 280], "confidence": 0.9}
      ]}

      FORBIDDEN OUTPUTS:
      - "bbox": [x1, y1, x2, y2] ← WRONG! Use actual numbers
      - Missing ] or } ← WRONG! Complete all brackets
      - Extra text after JSON ← WRONG! Only JSON

      Provide the detection results now as complete JSON only:

    # Keypoints 任务
    keypoints: |
      Detect all persons in this image and estimate their body pose with 17 keypoints.

      Respond ONLY with valid JSON in this exact format:
      {"persons": [{"bbox": [x, y, width, height], "keypoints": [{"name": "nose", "x": 123, "y": 456, "visibility": 2}]}]}

      Keypoint names: nose, left_eye, right_eye, left_ear, right_ear, left_shoulder, right_shoulder, left_elbow, right_elbow, left_wrist, right_wrist, left_hip, right_hip, left_knee, right_knee, left_ankle, right_ankle

      Visibility: 0=not visible, 1=occluded, 2=visible

      Example response:
      {"persons": [{"bbox": [50, 100, 200, 300], "keypoints": [{"name": "nose", "x": 150, "y": 120, "visibility": 2}, ...]}]}

  # ==================
  # CoT Prompt（思维链）
  # ==================

  cot:
    # VQA CoT
    vqa: |
      Analyze this image step by step to answer the following question.
      Question: {question}

      Please think through this systematically:
      1. First, identify all visual elements in the image.
      2. Next, analyze their attributes and relationships.
      3. Then, consider the context and scene.
      4. Finally, based on your analysis, provide the answer.

      Let's start:

    # Captioning CoT
    captioning: |
      Describe this image systematically. Think through the following steps:
      1. Identify the main subjects and objects.
      2. Describe their attributes and positions.
      3. Note the scene and setting.
      4. Describe any actions or activities.
      5. Combine everything into a comprehensive caption.

      Let's analyze:

    # Detection CoT
    detection: |
      Detect objects in this image systematically:

      STEP-BY-STEP:
      1. Scan image from top-left to bottom-right
      2. For each object found:
         - Identify category (person, car, dog, etc.)
         - Mark bbox: [x1, y1, x2, y2] with REAL numbers
         - Assign confidence 0.7-1.0
      3. Verify all brackets [ and { are CLOSED before finalizing

      CRITICAL JSON FORMAT - MUST follow exactly:
      {"objects": [
        {"category": "person", "bbox": [100, 50, 200, 300], "confidence": 0.95},
        {"category": "car", "bbox": [250, 150, 400, 280], "confidence": 0.9}
      ]}

      ABSOLUTE REQUIREMENTS:
      - NO placeholder text like [x_min, y_min]
      - NO missing brackets - every [ must have ]
      - NO incomplete arrays - bbox has 4 numbers and closing ]
      - NO extra text - ONLY JSON

      Provide complete detection results as JSON now:

    # Keypoints CoT
    keypoints: |
      Estimate human poses in this image systematically:
      1. Identify all persons in the image and their approximate locations.
      2. For each person, locate head and face keypoints (nose, eyes, ears).
      3. Identify upper body keypoints (shoulders, elbows, wrists).
      4. Locate lower body keypoints (hips, knees, ankles).
      5. For each keypoint, provide coordinates [x, y] and visibility (0/1/2).

      After analysis, provide results ONLY as valid JSON:
      {"persons": [{"bbox": [x, y, w, h], "keypoints": [{"name": "nose", "x": 123, "y": 456, "visibility": 2}]}]}

      Let's start the pose estimation:

  # ==================
  # 默认 Prompt
  # ==================

  default:
    standard: "Analyze this image."
    cot: "Analyze this image step by step."