# Prompt Configuration (中文版)
# ====================
#
# 针对 Qwen2.5-VL-7B 模型优化的中文 Prompt
# - 简洁明了，适合 7B 模型理解能力
# - 发挥千问中文理解优势
# - 明确格式要求，确保稳定输出
#

prompts:
  # ==================
  # 普通 Prompt（无 CoT）
  # ==================

  standard:
    # VQA 任务
    vqa: |
      请看图回答问题：{question}

      要求：
      1. 只用一个词或数字回答
      2. 不要解释
      3. 示例：yes, no, two, red

      回答：

  # ==================
  # CoT Prompt（思维链）
  # ==================

  cot:
    # VQA CoT
    vqa: |
      请一步步分析图片并回答：{question}

      分析步骤：
      1. 看到什么？
      2. 分析细节
      3. 得出结论

      让我们开始：

  # ==================
  # 默认 Prompt
  # ==================

  default:
    standard: "分析这张图片。"
    cot: "请一步步分析这张图片。"