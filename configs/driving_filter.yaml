# ============================================================
# 智能驾驶数据筛选配置文件
# ============================================================
# 功能：从COCO数据集中筛选智能驾驶相关数据
# 使用：python tools/driving_filter/run_filter.py --config configs/driving_filter.yaml

driving_data_filter:
  # ============================================================
  # 数据源配置
  # ============================================================
  data_source:
    coco_root: "./data/coco"
    annotations_root: "./data/coco/annotations"
    images_root: "./data/coco/val2014"
    split: "val2014"  # 可选：val2014, train2014

  # ============================================================
  # 输出配置
  # ============================================================
  output:
    root: "./data/filter_coco"
    annotations_dir: "annotations"
    images_dir: "images"
    copy_images: false  # false=符号链接（节省空间），true=复制文件
    include_metadata: true

  # ============================================================
  # 类别筛选配置
  # ============================================================
  categories:
    # 智能驾驶核心类别（COCO类别ID）
    # 来源：COCO 80类中与智能驾驶相关的类别
    driving_categories:
      - 1   # person (行人) ⭐
      - 2   # bicycle (自行车)
      - 3   # car (汽车) ⭐⭐⭐
      - 4   # motorcycle (摩托车)
      - 5   # airplane (飞机) - 场景多样性
      - 6   # bus (公交车) ⭐⭐
      - 7   # train (火车) - 场景多样性
      - 8   # truck (卡车) ⭐⭐
      - 9   # boat (船) - 场景多样性
      - 10  # traffic light (交通灯) ⭐⭐⭐
      - 12  # fire hydrant (消防栓)
      - 13  # stop sign (停止标志) ⭐⭐⭐
      - 14  # parking meter (停车计时器)
      - 15  # bench (长椅) - 道路设施

    # 类别权重（核心类别权重更高，影响类别得分计算）
    weights:
      3: 2.0   # car - 最核心
      6: 2.0   # bus - 大型车辆
      8: 2.0   # truck - 大型车辆
      10: 2.0  # traffic light - 交通设施
      13: 2.0  # stop sign - 交通标志
      1: 1.5   # person - 行人
      'default': 1.0

    min_objects: 1  # 至少包含1个相关对象

  # ============================================================
  # 语义筛选配置
  # ============================================================
  semantics:
    # 关键词库文件路径（如果文件不存在，使用内置关键词库）
    keywords_file: "configs/driving_keywords.txt"

    # 匹配模式
    match_caption: true       # 检查COCO Caption文本
    match_vqa_question: true  # 检查VQA问题文本
    match_vqa_answer: false   # 检查VQA答案文本（通常不需要）

    # 匹配阈值
    min_keyword_matches: 1    # 至少匹配1个关键词

  # ============================================================
  # 场景特征筛选配置
  # ============================================================
  scene_features:
    # 图像宽高比约束（道路场景多为宽屏）
    aspect_ratio:
      enabled: true
      min: 1.0   # 最小宽高比（方形或宽屏）
      max: 3.0   # 最大宽高比（避免过度宽屏）

    # 对象数量约束（复杂场景筛选）
    object_count:
      enabled: true
      min: 2     # 最少对象数（复杂场景）
      max: 50    # 最多对象数（避免过度拥挤）

  # ============================================================
  # 综合评分配置
  # ============================================================
  scoring:
    # 🔧 各维度权重（道路场景优先，车辆非必须）
    # 提高文本权重：道路文本关键词是核心证据
    category_weight: 0.35     # 类别得分权重（降低，车辆非必须）
    text_weight: 0.40         # 文本语义得分权重（提高，道路文本是核心）
    scene_weight: 0.25        # 场景特征得分权重

    # 分数阈值
    score_threshold: 0.9     # 🔧 中等阈值：有道路文本或交通设施即可通过
    high_quality_threshold: 0.9  # 高质量样本阈值

  # ============================================================
  # 处理参数
  # ============================================================
  processing:
    batch_size: 100          # 批处理大小
    show_progress: true      # 显示进度条
    save_intermediate: true  # 保存中间结果

    # 性能优化
    use_multiprocessing: false  # 是否使用多进程（Windows下建议关闭）
    num_workers: 4              # 多进程工作数