# Distillation Parameters Configuration

# Knowledge Distillation Settings
distillation_params:
  # General settings
  batch_size: 8
  accumulation_steps: 1

  # Temperature for soft labels
  teacher_temperature: 2.0
  student_temperature: 1.0

  # Loss weights
  hard_label_weight: 1.0
  soft_label_weight: 0.5
  cot_weight: 0.3

# Hard Label Generation
hard_label:
  # Extraction method
  method: "argmax"  # Options: argmax, threshold, beam_search

  # Threshold settings
  confidence_threshold:
    vqa: 0.7
    captioning: 0.6
    detection: 0.5

  # Post-processing
  deduplicate_answers: true
  filter_low_confidence: true

# Soft Label Generation
soft_label:
  # Temperature scaling
  temperature: 2.0

  # Probability distribution settings
  top_k: 100  # Keep top-k probabilities
  min_probability: 0.01  # Minimum probability to keep

  # Token-level soft labels
  include_token_probabilities: false
  max_tokens_to_save: 500

  # Logits storage
  save_logits: false  # Raw logits (large storage)
  logits_compression: "top-k"  # Options: top-k, threshold, none

# Chain-of-Thought Generation
cot:
  # Generation strategy
  strategy: "structured"  # Options: freeform, structured, guided

  # Structured reasoning format
  structured_format:
    - "observation"
    - "analysis"
    - "reasoning"
    - "conclusion"

  # Length constraints
  min_length: 50
  max_length: 512

  # Quality control
  require_keywords:
    - "first"
    - "next"
    - "then"
    - "finally"
  check_logical_flow: true

  # Multi-step reasoning
  max_steps: 5
  step_separator: "\n\nStep "

# Task-specific settings
task_configs:
  vqa:
    # VQA-specific distillation
    generate_multiple_answers: true
    num_answer_candidates: 5

    # Reasoning focus
    focus_areas:
      - "visual_elements"
      - "object_attributes"
      - "spatial_relationships"
      - "actions"

  captioning:
    # Captioning-specific distillation
    generate_multiple_captions: true
    num_caption_variations: 3

    # Reasoning focus
    focus_areas:
      - "main_subjects"
      - "scene_description"
      - "attributes"
      - "activities"

  detection:
    # Detection-specific distillation
    generate_bbox_reasoning: true

    # Coordinate format
    bbox_format: "xyxy"  # Options: xyxy, xywh, normalized

    # Object-level reasoning
    include_object_attributes: true
    include_spatial_context: true

# Quality Metrics
quality_metrics:
  # Consistency checks
  check_hard_soft_consistency: true
  check_cot_hard_consistency: true

  # Diversity metrics
  measure_answer_diversity: true
  measure_caption_diversity: true

  # Confidence calibration
  calibration_method: "temperature_scaling"

# Validation and filtering
validation:
  # Schema validation
  validate_json_schema: true

  # Quality filters
  min_confidence_threshold: 0.3
  min_cot_length: 30

  # Error handling
  skip_failed_samples: true
  max_retries: 3
  retry_delay: 1  # seconds
