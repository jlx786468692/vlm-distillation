project:
  name: "vlm-distillation"
  version: "1.0.0"
  description: "VLM data distillation pipeline using Qwen2.5-VL-7B-Instruct"

# Prompt 配置文件路径
prompts_config: "configs/prompts.yaml"

teacher:
  model_name: "models/Qwen2.5-VL-7B-Instruct"
  device: "cuda"
  precision: "bf16"  # bfloat16 for efficiency
  max_length: 2048

  # 通用生成参数（适用于VQA、Captioning等任务）
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  max_new_tokens: 512

  # 检测任务专用优化参数（提高置信度、减少截断）
  detection_temperature: 0.3      # 低温度=更确定性输出（避免低置信度）
  detection_top_p: 0.95           # 高top_p=更结构化JSON
  max_detection_tokens: 1024      # 长生成长度=避免截断（从512增加到1024）

student:
  model_name: "models/Qwen2.5-VL-3B-Instruct"  # To be configured (e.g., Qwen/Qwen2-VL-2B-Instruct)
  device: "cuda"

data:
  coco_root: "./data/coco"
  annotations_root: "./data/coco/annotations"
  images_root: "./data/coco/val2014"

  # Dataset splits
  train_split: "train2014"
  val_split: "val2014"

  # Processing parameters
  batch_size: 4
  num_workers: 4
  max_samples: 5000  # For small-scale processing (set to null for full dataset)

  # Image preprocessing
  image_size: 224
  max_pixels: 1003520  # Maximum pixels for Qwen-VL

  # Sampling strategy
  sampling_strategy: "balanced"  # Options: random, balanced, stratified
  seed: 42

distillation:
  # Task configuration
  tasks:
    - "vqa"
    # - "captioning"
    - "detection"
    # - "keypoints"  # 需要person_keypoints标注文件，暂不启用

  # Hard label configuration
  hard_labels:
    enabled: true
    confidence_threshold: 0.7
    save_format: "json"

  # Soft label configuration
  soft_labels:
    enabled: true
    temperature: 2.0  # Temperature for knowledge distillation
    top_k_logits: 100  # Keep top-k logits/probabilities for storage
    save_format: "json"

  # Chain-of-Thought configuration
  cot:
    enabled: true
    max_length: 512
    include_intermediate_steps: true
    structured_output: true  # Generate structured reasoning with steps
    save_format: "json"

  # Processing options
  parallel_processing: false
  checkpoint_interval: 100  # Save checkpoint every N images
  resume_from_checkpoint: null

output:
  root_dir: "./outputs"
  format: "json"
  merge_outputs: true  # Merge all task outputs into single JSON per image
  compress_outputs: false  # Compress large soft label arrays
  save_metadata: true

  # Subdirectories
  hard_labels_dir: "./outputs/hard_labels"
  soft_labels_dir: "./outputs/soft_labels"
  cot_reasoning_dir: "./outputs/cot_reasoning"
  merged_dir: "./outputs/merged"

logging:
  level: "INFO"
  log_file: "./logs/distillation.log"
  console_output: true
  tensorboard: false  # Enable tensorboard logging

validation:
  validate_schema: true
  check_image_paths: true
  min_samples_per_task: 10

# ============================================================
# 数据清洗配置 (Data Cleaning Configuration)
# ============================================================
cleaning:
  # 是否启用数据清洗
  enabled: true

  # 异常检测阈值
  min_confidence: 0.6            # 最低置信度阈值（提高到0.6，过滤更多低置信度数据）
  max_confidence: 0.95           # 最高置信度阈值（高于此值可能过于自信）
  min_quality_score: 50.0        # 最低质量分数阈值（提高到50，移除低质量数据）
  min_cot_quality: 0.5           # 最低CoT逻辑流畅度分数

  # 答案长度限制
  min_answer_length: 3           # 最短答案长度（字符）
  max_answer_length: 100         # 最长答案长度（字符）

  # 清洗策略
  auto_remove_invalid: true      # 自动移除无效数据（invalid_answer/empty_result）
  remove_empty_results: true     # 移除有空结果的样本（设置为false可保留部分任务数据）
  auto_repair_bbox: true         # 自动修复异常检测框
  deduplicate_answers: true      # 答案去重（标记但不移除）

  # 报告设置
  save_removed_data: true        # 保存被移除的数据供分析
  max_removed_samples_display: 20  # 报告中最多展示的被移除样本数

  # 无效答案列表（会被自动移除）
  invalid_answers:
    - "unknown"
    - "n/a"
    - "none"
    - "null"
    - "nothing"
    - "i don't know"
    - "cannot determine"
    - "unclear"
    - "no answer"
    - "not sure"

# ============================================================
# 数据可视化配置 (Visualization Configuration)
# ============================================================
visualization:
  # 是否启用可视化
  enabled: true

  # 输出设置
  output_dir: "./outputs/visualizations"
  plot_format: "png"  # 支持格式: png, svg, pdf
  dpi: 150
  save_plots: true

  # 图表通用设置
  figsize:
    width: 12
    height: 8
  style: "seaborn-v0_8-whitegrid"  # matplotlib样式

  # ============================================================
  # 统计图表配置
  # ============================================================
  charts:
    # 置信度分布图（直方图+箱线图）
    confidence_distribution:
      enabled: true
      bins: 30

    # 质量分数分布图
    quality_scores:
      enabled: true
      bins: 20
      show_thresholds: true

    # 任务分布图（饼图+柱状图）
    task_distribution:
      enabled: true
      show_percentages: true

    # CoT质量分析图
    cot_quality:
      enabled: true
      show_step_distribution: true

  # ============================================================
  # 样本可视化配置
  # ============================================================
  sample_visualization:
    enabled: true
    max_samples: 10              # 最大可视化样本数

    # 展示内容配置
    show_hard_label: true
    show_soft_label: true
    show_cot: true
    show_bbox: true

    # 图像设置
    figsize:
      width: 16
      height: 12
    dpi: 100

    # 边界框颜色
    bbox_colors:
      person: "#FF6B6B"
      car: "#4ECDC4"
      default: "#3498DB"

    # 软标签显示
    soft_label_display:
      top_k: 5

    # CoT显示
    cot_display:
      max_length: 200

  # ============================================================
  # 时间线可视化配置
  # ============================================================
  timeline_visualization:
    enabled: true

    quality_timeline:
      enabled: true
      show_threshold: true
      show_pass_fail: true

    confidence_timeline:
      enabled: true
      show_threshold: true
      show_high_low: true

  # ============================================================
  # 步骤耗时可视化配置
  # ============================================================
  timing_visualization:
    enabled: true
    show_cumulative: true        # 显示累计耗时
    show_percentage: true        # 显示耗时占比
    show_average_line: true      # 显示平均耗时线

  # ============================================================
  # HTML报告配置
  # ============================================================
  html_report:
    enabled: true
    filename: "visualization_report.html"
    include_summary: true