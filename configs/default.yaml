project:
  name: "vlm-distillation"
  version: "1.0.0"
  description: "VLM data distillation pipeline using Qwen2.5-VL-32B-Instruct-AWQ as teacher"

# Prompt 配置文件路径
# prompts_config: "configs/prompts.yaml"  # 原版本（已删除）
# prompts_config: "configs/prompts_zh.yaml"  # 中文版本
prompts_config: "configs/prompts_en.yaml"  # 英文版本（数据集为英文）

# Pipeline 运行控制
pipeline:
  # 默认运行的步骤（可通过命令行 --steps 覆盖）
  default_steps:
    - "distillation"
    # - "initial_validation"
    # - "cleaning"
    # - "final_validation"
    # - "quality_validation"
    # - "visualization"  # 可视化默认不运行，需要显式指定

  # 断点续运行
  checkpoint_path: null  # 设置为具体路径可恢复运行，如 "./outputs/checkpoint_latest.json"

  # 测试运行（只验证配置，不实际运行）
  dry_run: false

teacher:
  # 🔧 GPU选择：设置CUDA_VISIBLE_DEVICES环境变量
  # 使用GPU 1（如果GPU 0被占用）：cuda_devices: "1"
  # 使用双卡张量并行：cuda_devices: "0,1" 且 tensor_parallel_size: 2
  # 留空则使用所有可见GPU
  cuda_devices: "0"  # 单卡运行（32B-AWQ约20GB显存）

  # 🔧 模型选择（Qwen2.5-VL 系列）
  # 3B: ~6GB 显存，单卡
  # 7B-AWQ: ~12GB 显存，单卡
  # 32B-AWQ: ~20GB 显存，单卡推荐
  # 32B-FP16: ~40GB 显存，双卡
  model_name: "models/Qwen2.5-VL-32B-Instruct-AWQ"
  device: "cuda"
  precision: "4bit"  # AWQ 4-bit quantization
  max_length: 2048
  use_awq: true  # 使用 transformers 原生 AWQ 支持（4.51+）

  # vLLM 配置（Qwen2.5-VL 多模态有 bug，禁用）
  use_vllm: false

  # 通用生成参数（适用于VQA、Captioning等任务）
  # 【32B模型优化】使用贪婪解码（temperature=0）
  # 原因：
  # 1. 硬标签需要确定性（每次结果相同）
  # 2. 软标签中的概率分布仍然保留（不确定性信息）
  # 3. 32B模型容量更大，贪婪解码质量更高
  temperature: 0.0       # 贪婪解码，确保结果确定性
  top_p: 1.0            # temperature=0时，top_p不生效
  top_k: 1              # temperature=0时，top_k不生效
  max_new_tokens: 768   # 🔧 32B模型：增加到768（从512），支持更长输出

  # 🔧 视觉特征缓存配置（性能优化）
  # 减少两次推理中的重复图像编码计算，提升约15-20%性能
  cache_visual_features: true      # 启用视觉特征缓存（默认：true）
  cache_max_size: 1000            # 最大缓存数量（防止内存溢出）

student:
  model_name: "models/Qwen2.5-VL-3B-Instruct"  # To be configured (e.g., Qwen/Qwen2-VL-2B-Instruct)
  device: "cuda"

data:
  coco_root: "./data/coco"
  annotations_root: "./data/coco/annotations"
  images_root: "./data/coco/val2014"

  # Dataset splits
  train_split: "train2014"
  val_split: "val2014"

  # Processing parameters
  batch_size: 4
  num_workers: 4
  max_samples: 10  # 【优化】先用10个样本测试参数调整效果，后续可增加到5000

  # Image preprocessing
  image_size: 224
  max_pixels: 1003520  # Maximum pixels for Qwen-VL

  # Sampling strategy
  sampling_strategy: "balanced"  # Options: random, balanced, stratified
  seed: 42

distillation:
  # Task configuration
  # 🔧 专注于VQA任务的数据蒸馏
  # 原因：VLM大模型在VQA任务上效果最佳，其他任务（detection, captioning, keypoints）效果不稳定
  tasks:
    - "vqa"

  # Hard label configuration
  hard_labels:
    enabled: true
    confidence_threshold: 0.4  # 🔧 置信度阈值：低于此值将跳过soft_label和CoT生成（性能优化）
    save_format: "json"

  # Soft label configuration
  soft_labels:
    enabled: true  # VQA软标签生成
    temperature: 4  # 温度缩放参数，控制分布平滑度
    top_k_logits: 50  # Top-K兜底策略
    save_format: "json"

  # Chain-of-Thought configuration
  cot:
    enabled: true
    max_length: 512
    include_intermediate_steps: true
    structured_output: true  # Generate structured reasoning with steps
    save_format: "json"

  # Processing options
  parallel_processing: false
  checkpoint_interval: 20  # Save checkpoint every N images (降低到20，更频繁保存)
  resume_from_checkpoint: null

output:
  root_dir: "./outputs"
  format: "json"
  merge_outputs: true  # Merge all task outputs into single JSON per image
  compress_outputs: false  # Compress large soft label arrays
  save_metadata: true

  # 各步骤输出目录（单步运行时自动使用作为默认输入）
  merged_dir: "./outputs/merged"        # Distillation 输出
  cleaned_dir: "./outputs/cleaned"      # Cleaning 输出
  visualization_dir: "./outputs/visualizations"  # Visualization 输出

logging:
  level: "INFO"
  log_file: "./logs/distillation.log"
  console_output: true
  tensorboard: false  # Enable tensorboard logging

validation:
  validate_schema: true
  check_image_paths: true
  min_samples_per_task: 10

# ============================================================
# 数据清洗配置 (Data Cleaning Configuration)
# ============================================================
cleaning:
  # 是否启用数据清洗
  enabled: true

  # 异常检测阈值
  min_confidence: 0.3            # 最低置信度阈值（降低到0.3，允许更多低置信度数据通过）
  max_confidence: 0.95           # 最高置信度阈值（高于此值可能过于自信）
  min_quality_score: 35.0        # 最低质量分数阈值（降低到35，基于实际数据质量调整）
  min_cot_quality: 0.3           # 最低CoT逻辑流畅度分数（降低到0.3）

  # 答案长度限制
  min_answer_length: 3           # 最短答案长度（字符）
  max_answer_length: 100         # 最长答案长度（字符）

  # 清洗策略
  auto_remove_invalid: true      # 自动移除无效数据（invalid_answer/empty_result）
  remove_empty_results: false    # 移除有空结果的样本（设置为false保留部分任务数据）
  auto_repair_bbox: true         # 自动修复异常检测框
  deduplicate_answers: true      # 答案去重（标记但不移除）

  # 报告设置
  save_removed_data: true        # 保存被移除的数据供分析
  max_removed_samples_display: 20  # 报告中最多展示的被移除样本数

  # 无效答案列表（会被自动移除）
  invalid_answers:
    - "unknown"
    - "n/a"
    - "none"
    - "null"
    - "nothing"
    - "i don't know"
    - "cannot determine"
    - "unclear"
    - "no answer"
    - "not sure"
    - "indeterminate"
    - " "

# ============================================================
# 数据可视化配置 (Visualization Configuration)
# ============================================================
visualization:
  # 是否启用可视化
  enabled: true

  # 输出设置
  output_dir: "./outputs/visualizations"
  plot_format: "png"  # 支持格式: png, svg, pdf
  dpi: 150
  save_plots: true

  # 图表通用设置
  figsize:
    width: 12
    height: 8
  style: "seaborn-v0_8-whitegrid"  # matplotlib样式

  # ============================================================
  # 统计图表配置
  # ============================================================
  charts:
    # 置信度分布图（直方图+箱线图）
    confidence_distribution:
      enabled: true
      bins: 30

    # 质量分数分布图
    quality_scores:
      enabled: true
      bins: 20
      show_thresholds: true

    # 任务分布图（饼图+柱状图）
    task_distribution:
      enabled: true
      show_percentages: true

    # CoT质量分析图
    cot_quality:
      enabled: true
      show_step_distribution: true

  # ============================================================
  # 样本可视化配置
  # ============================================================
  sample_visualization:
    enabled: true
    max_samples: 10              # 最大可视化样本数

    # 展示内容配置
    show_hard_label: true
    show_soft_label: true
    show_cot: true
    show_bbox: true

    # 图像设置
    figsize:
      width: 16
      height: 12
    dpi: 100

    # 边界框颜色
    bbox_colors:
      person: "#FF6B6B"
      car: "#4ECDC4"
      default: "#3498DB"

    # 软标签显示
    soft_label_display:
      top_k: 5

    # CoT显示
    cot_display:
      max_length: 200

  # ============================================================
  # 时间线可视化配置
  # ============================================================
  timeline_visualization:
    enabled: true

    quality_timeline:
      enabled: true
      show_threshold: true
      show_pass_fail: true

    confidence_timeline:
      enabled: true
      show_threshold: true
      show_high_low: true

  # ============================================================
  # 步骤耗时可视化配置
  # ============================================================
  timing_visualization:
    enabled: true
    show_cumulative: true        # 显示累计耗时
    show_percentage: true        # 显示耗时占比
    show_average_line: true      # 显示平均耗时线

  # ============================================================
  # HTML报告配置
  # ============================================================
  html_report:
    enabled: true
    filename: "visualization_report.html"
    include_summary: true

# ============================================================
# VQA Token 过滤器配置
# ============================================================
vqa_token_filter:
  # 配置文件路径（独立的YAML文件）
  config_file: "configs/vqa_token_filter.yaml"