project:
  name: "vlm-distillation"
  version: "1.0.0"
  description: "VLM data distillation pipeline using Qwen2.5-VL-7B-Instruct"

teacher:
  model_name: "models/Qwen2.5-VL-7B-Instruct"
  device: "cuda"
  precision: "bf16"  # bfloat16 for efficiency
  max_length: 2048
  temperature: 0.7
  top_p: 0.9

student:
  model_name: "models/Qwen2.5-VL-3B-Instruct"  # To be configured (e.g., Qwen/Qwen2-VL-2B-Instruct)
  device: "cuda"

data:
  coco_root: "./data/coco"
  annotations_root: "./data/coco/annotations"
  images_root: "./data/coco/images"

  # Dataset splits
  train_split: "train2014"
  val_split: "val2014"

  # Processing parameters
  batch_size: 4
  num_workers: 4
  max_samples: 5000  # For small-scale processing (set to null for full dataset)

  # Image preprocessing
  image_size: 224
  max_pixels: 1003520  # Maximum pixels for Qwen-VL

  # Sampling strategy
  sampling_strategy: "balanced"  # Options: random, balanced, stratified
  seed: 42

distillation:
  # Task configuration
  tasks:
    - "vqa"
    # - "captioning"
    # - "detection"
    # - "keypoints"

  # Hard label configuration
  hard_labels:
    enabled: true
    confidence_threshold: 0.7
    save_format: "json"

  # Soft label configuration
  soft_labels:
    enabled: true
    temperature: 2.0  # Temperature for knowledge distillation
    top_k_logits: 100  # Keep top-k logits/probabilities for storage
    save_format: "json"

  # Chain-of-Thought configuration
  cot:
    enabled: true
    max_length: 512
    include_intermediate_steps: true
    structured_output: true  # Generate structured reasoning with steps
    save_format: "json"

  # Processing options
  parallel_processing: false
  checkpoint_interval: 100  # Save checkpoint every N images
  resume_from_checkpoint: null

output:
  root_dir: "./outputs"
  format: "json"
  merge_outputs: true  # Merge all task outputs into single JSON per image
  compress_outputs: false  # Compress large soft label arrays
  save_metadata: true

  # Subdirectories
  hard_labels_dir: "./outputs/hard_labels"
  soft_labels_dir: "./outputs/soft_labels"
  cot_reasoning_dir: "./outputs/cot_reasoning"
  merged_dir: "./outputs/merged"

logging:
  level: "INFO"
  log_file: "./logs/distillation.log"
  console_output: true
  tensorboard: false  # Enable tensorboard logging

validation:
  validate_schema: true
  check_image_paths: true
  min_samples_per_task: 10

# ============================================================
# 数据清洗配置 (Data Cleaning Configuration)
# ============================================================
cleaning:
  # 是否启用数据清洗
  enabled: true

  # 异常检测阈值
  min_confidence: 0.5            # 最低置信度阈值（低于此值标记为异常）
  max_confidence: 0.95           # 最高置信度阈值（高于此值可能过于自信）
  min_quality_score: 30.0        # 最低质量分数阈值（0-100，低于此值移除）
  min_cot_quality: 0.5           # 最低CoT逻辑流畅度分数

  # 答案长度限制
  min_answer_length: 3           # 最短答案长度（字符）
  max_answer_length: 100         # 最长答案长度（字符）

  # 清洗策略
  auto_remove_invalid: true      # 自动移除无效数据（invalid_answer/empty_result）
  auto_repair_bbox: true         # 自动修复异常检测框
  deduplicate_answers: true      # 答案去重（标记但不移除）

  # 报告设置
  save_removed_data: true        # 保存被移除的数据供分析
  max_removed_samples_display: 20  # 报告中最多展示的被移除样本数

  # 无效答案列表（会被自动移除）
  invalid_answers:
    - "unknown"
    - "n/a"
    - "none"
    - "null"
    - "nothing"
    - "i don't know"
    - "cannot determine"
    - "unclear"
    - "no answer"
    - "not sure"
